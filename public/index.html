<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NJ81</title>
  <meta name="description" content="Edit the RGB lighting and screen of the Keydous NJ81 in the browser with WebHID.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <div>
      <h1 data-i18n="title">NJ81</h1>
      <p class="muted" data-i18n="subtitle"></p>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="vi" aria-pressed="true">VI</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </header>

  <p id="unsupported" class="notice" hidden data-i18n="notSupported"></p>

  <main class="grid">
    <section class="card" aria-labelledby="h-conn">
      <h2 id="h-conn" data-i18n="connection"></h2>
      <div class="row">
        <button id="connect" type="button" class="primary" data-i18n="connect"></button>
        <button id="connect-other" type="button" data-i18n="connectOther"></button>
        <button id="disconnect" type="button" data-i18n="disconnect" hidden></button>
        <span id="status" class="chip off" data-i18n="status_off"></span>
      </div>
      <label class="check"><input id="simulation" type="checkbox" checked> <span data-i18n="simulation"></span></label>
      <p class="muted small" data-i18n="connectionHelp"></p>
      <p id="device-name" class="small" hidden></p>
      <p id="via-info" class="small mono" hidden></p>
    </section>

    <section class="card wide" aria-labelledby="h-light">
      <h2 id="h-light" data-i18n="lighting"></h2>
      <div class="controls">
        <label>
          <span data-i18n="effect"></span>
          <select id="effect"></select>
        </label>
        <label id="light-option-box" hidden>
          <span data-i18n="direction"></span>
          <select id="light-option"></select>
        </label>
        <label id="color-box">
          <span data-i18n="color"></span>
          <input id="color" type="color" value="#ff7a66">
          <span id="swatches" class="swatches" aria-label="Preset colours"></span>
        </label>
        <label id="brightness-box">
          <span><span data-i18n="brightness"></span>: <output id="brightness-out">80</output>%</span>
          <input id="brightness" type="range" min="0" max="100" value="80">
        </label>
        <label id="speed-box">
          <span><span data-i18n="speed"></span>: <output id="speed-out">50</output>%</span>
          <input id="speed" type="range" min="0" max="100" value="50">
        </label>
      </div>
      <label class="caps-choice"><span data-i18n="capsColour"></span>
        <select id="caps"><option value="white" data-i18n="capsWhite"></option><option value="black" data-i18n="capsBlack"></option></select>
      </label>
      <label id="rainbow-box" class="check" hidden><input id="rainbow" type="checkbox"> <span data-i18n="rainbow"></span></label>
      <div id="mode-tools" class="row" hidden>
        <button id="learn-start" type="button" class="primary" data-i18n="learnStart"></button>
        <button id="rename-mode" type="button" data-i18n="renameMode"></button>
        <button id="hide-mode" type="button" data-i18n="hideMode"></button>
        <button id="show-modes" type="button" data-i18n="showModes" hidden></button>
      </div>
      <div id="learn-box" class="notice" hidden>
        <p data-i18n="learnHelp"></p>
        <p class="small"><span data-i18n="learnSeen"></span>: <span id="learn-seen">-</span></p>
        <button id="learn-done" type="button" class="primary" data-i18n="learnFinish"></button>
      </div>
      <p class="muted small" data-i18n="typeHint"></p>
      <div id="keyboard" class="keyboard" role="group" aria-label="Keyboard preview"></div>
      <div class="row">
        <p id="paint-help" class="muted small" data-i18n="paintHelp" hidden></p>
        <button id="fill-all" type="button" data-i18n="fillAll" hidden></button>
        <button id="clear-all" type="button" data-i18n="clearAll" hidden></button>
      </div>
      <p class="muted small" data-i18n="previewNote"></p>
    </section>

    <section class="card" aria-labelledby="h-screen">
      <h2 id="h-screen" data-i18n="screen"></h2>
      <div class="row">
        <label class="file-button"><span data-i18n="screenPick"></span><input id="screen-file" type="file" accept="image/*"></label>
        <label class="inline"><span data-i18n="screenFit"></span>
          <select id="screen-fit"><option value="cover" data-i18n="fitCover"></option><option value="contain" data-i18n="fitContain"></option></select>
        </label>
      </div>
      <canvas id="screen-canvas" class="screen" width="160" height="80" aria-label="Screen preview"></canvas>
      <p id="screen-name" class="muted small"></p>
      <div id="gif-controls" class="row" hidden>
        <button id="gif-play" type="button"></button>
        <label class="inline grow"><span data-i18n="gifFrame"></span> <input id="gif-frame" type="range" min="0" max="0" value="0"> <output id="gif-frame-out"></output></label>
        <p class="muted small" data-i18n="gifNote"></p>
      </div>
      <details class="gallery-box">
        <summary data-i18n="gallery"></summary>
        <div id="gallery" class="gallery"></div>
        <p class="muted small" data-i18n="galleryMore"></p>
        <ul id="gallery-links" class="links small"></ul>
      </details>
      <div id="screen-device" hidden>
        <div class="row">
          <label id="screen-slot-box" class="inline"><span data-i18n="screenSlot"></span> <select id="screen-slot"></select></label>
          <button id="screen-send" type="button" class="primary" data-i18n="screenSend"></button>
          <button id="screen-clock" type="button" data-i18n="screenClock"></button>
        </div>
        <progress id="screen-progress" hidden value="0" max="1"></progress>
        <p id="screen-device-note" class="muted small" data-i18n="screenDeviceNote"></p>
        <p id="screen-size-note" class="muted small" data-i18n="screenSizeUnknown" hidden></p>
      </div>
      <p id="screen-connect-note" class="muted small" data-i18n="screenNote"></p>
    </section>

    <section class="card" aria-labelledby="h-profile">
      <h2 id="h-profile" data-i18n="profile"></h2>
      <label>
        <span data-i18n="profileName"></span>
        <input id="profile-name" type="text" maxlength="60" value="My profile">
      </label>
      <div class="row">
        <button id="save-local" type="button" data-i18n="saveLocal"></button>
        <select id="saved-list" aria-label="Saved profiles"></select>
        <button id="load-local" type="button" data-i18n="load"></button>
      </div>
      <div class="row">
        <button id="export-json" type="button" data-i18n="exportJson"></button>
        <label class="file-button"><span data-i18n="importJson"></span><input id="import-json" type="file" accept="application/json,.json"></label>
      </div>
      <div class="row"><button id="apply" type="button" class="primary" data-i18n="apply"></button></div>
    </section>


    <section class="card wide" aria-labelledby="h-log">
      <h2 id="h-log" data-i18n="log"></h2>
      <div id="log" class="mono small log" aria-live="polite"></div>
    </section>
  </main>

  <footer class="muted small" data-i18n="footer"></footer>
  <script type="module" src="js/app.js"></script>
</body>
</html>
