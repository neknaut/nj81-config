<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NJ81 Config</title>
  <meta name="description" content="Edit the RGB lighting and screen of the Keydous NJ81 in the browser with WebHID.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;700&amp;display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">

  <aside class="side">
    <div class="brand">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2"></rect><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"></path></svg>
      <span>NJ81 Config</span>
    </div>

    <section class="device" aria-labelledby="h-conn">
      <h2 id="h-conn" class="sr-only" data-i18n="connection"></h2>
      <div class="device-state"><span id="status-dot" class="dot"></span><span id="status" data-i18n="status_off"></span></div>
      <p id="device-name" class="device-text" hidden></p>
      <p id="device-info" class="device-text" hidden></p>
      <button id="connect" type="button" class="primary" data-i18n="connect"></button>
      <button id="connect-other" type="button" data-i18n="connectOther"></button>
      <button id="disconnect" type="button" data-i18n="disconnect" hidden></button>
      <p id="connection-help" class="device-text" data-i18n="connectionHelp"></p>
    </section>

    <nav class="nav" aria-label="Menu">
      <button type="button" data-tab="light" data-i18n="lighting"></button>
      <button type="button" data-tab="keys" data-i18n="keysTab"></button>
      <button type="button" data-tab="screen" data-i18n="screen"></button>
      <button type="button" data-tab="profile" data-i18n="profile"></button>
      <button type="button" data-tab="log" data-i18n="log"></button>
    </nav>

    <div class="side-foot">
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="vi" aria-pressed="true">VI</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
      <p data-i18n="footer"></p>
    </div>
  </aside>

  <main class="main">
    <p id="unsupported" class="notice" hidden data-i18n="notSupported"></p>

    <div class="main-head">
      <div>
        <h1 id="page-title" data-i18n="lighting"></h1>
        <p id="page-sub" class="sub" data-i18n="subLight"></p>
      </div>
      <div id="confirm-pill" class="pill" hidden>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>
        <span id="confirm-text"></span>
      </div>
    </div>

    <section id="start-hint" class="panel start-hint">
      <h2 data-i18n="startTitle"></h2>
      <p data-i18n="startText"></p>
    </section>

    <!-- The keyboard drawing, on the Lighting and Screen tabs -->
    <section id="keyboard-panel" class="panel" aria-label="Keyboard" hidden>
      <div class="keyboard-bar">
        <p class="hint" data-i18n="typeHint"></p>
        <button id="mini-clock" type="button" class="small-btn" data-i18n="screenClock" data-i18n-title="screenClockTitle"></button>
      </div>
      <div id="keyboard" class="keyboard" role="group" aria-label="Keyboard preview"></div>
    </section>

    <!-- Lighting -->
    <div id="tab-light" class="tab needs-keyboard" hidden>

      <div class="cols">
        <section class="panel" aria-labelledby="h-effect">
          <h2 id="h-effect"><span data-i18n="effect"></span> <span id="effect-count" class="h-note"></span></h2>
          <select id="effect" class="sr-only" tabindex="-1" aria-hidden="true"></select>
          <div id="effect-list" class="effect-list"></div>
          <label id="reactive-box" class="check" hidden><input id="reactive" type="checkbox"> <span data-i18n="reactiveLabel"></span></label>
          <p id="reactive-hint" class="notice" data-i18n="reactiveHint" hidden></p>
          <div id="mode-tools" class="tools" hidden>
            <button id="learn-start" type="button" data-i18n="learnStart"></button>
            <button id="show-modes" type="button" data-i18n="showModes" hidden></button>
          </div>
          <div id="learn-box" class="notice" hidden>
            <p data-i18n="learnHelp"></p>
            <p><span data-i18n="learnSeen"></span>: <span id="learn-seen">-</span></p>
            <button id="learn-done" type="button" class="primary" data-i18n="learnFinish"></button>
          </div>
        </section>

        <section class="panel tune" aria-labelledby="h-tune">
          <h2 id="h-tune" data-i18n="tune"></h2>
          <div id="light-option-box" class="field" hidden>
            <div class="label" data-i18n="direction"></div>
            <select id="light-option" class="sr-only" tabindex="-1" aria-hidden="true"></select>
            <div id="dir-chips" class="chips"></div>
          </div>
          <div id="color-box" class="field">
            <div class="label"><span data-i18n="color"></span> <span id="color-hex" class="value mono"></span></div>
            <div id="swatches" class="swatches">
              <label class="swatch custom" data-i18n-title="colorCustom"><input id="color" type="color" value="#ff7a66"><span aria-hidden="true">+</span></label>
            </div>
          </div>
          <label id="rainbow-box" class="check" hidden><input id="rainbow" type="checkbox"> <span data-i18n="rainbow"></span></label>
          <div id="brightness-box" class="field">
            <div class="label"><span data-i18n="brightness"></span> <output id="brightness-out" class="value"></output></div>
            <input id="brightness" type="range" min="0" max="100" value="80" class="sr-only" tabindex="-1" aria-hidden="true">
            <div id="brightness-steps" class="steps"></div>
          </div>
          <div id="speed-box" class="field">
            <div class="label"><span data-i18n="speed"></span> <output id="speed-out" class="value"></output></div>
            <input id="speed" type="range" min="0" max="100" value="50" class="sr-only" tabindex="-1" aria-hidden="true">
            <div id="speed-steps" class="steps"></div>
          </div>
          <div class="field">
            <label class="label" for="caps" data-i18n="capsColour"></label>
            <select id="caps"><option value="white" data-i18n="capsWhite"></option><option value="black" data-i18n="capsBlack"></option></select>
          </div>
        </section>

        <section class="panel" aria-labelledby="h-status">
          <div class="panel-head"><h2 id="h-status" data-i18n="statusTitle"></h2><button type="button" class="small-btn clear-log" data-i18n="clearLog"></button></div>
          <div id="light-status" hidden>
            <table class="status">
              <thead><tr><th data-i18n="statusField"></th><th data-i18n="statusSent"></th><th data-i18n="statusKeyboard"></th></tr></thead>
              <tbody id="light-status-body"></tbody>
            </table>
            <p class="hint"><span data-i18n="effectsTried"></span>: <span id="effect-report">-</span></p>
          </div>
          <div id="mini-log" class="mini-log" aria-live="polite"></div>
        </section>
      </div>
    </div>

    <!-- Keys: remap, Fn shortcuts, macros -->
    <div id="tab-keys" class="tab needs-keyboard" hidden>
      <p id="keys-unsupported" class="notice" data-i18n="keysUnsupported" hidden></p>
      <div class="cols">
        <section class="panel" aria-labelledby="h-keymap">
          <div class="panel-head">
            <h2 id="h-keymap" data-i18n="keysRemap"></h2>
            <button id="keys-reload" type="button" class="small-btn" data-i18n="keysReload"></button>
          </div>
          <div class="chips" role="group" aria-label="Layer">
            <button type="button" data-layer="normal" aria-pressed="true" data-i18n="layerNormal"></button>
            <button type="button" data-layer="fn" aria-pressed="false" data-i18n="layerFn"></button>
          </div>
          <p id="keys-state" class="hint"></p>
          <p id="key-pick-hint" class="hint" data-i18n="keysPickHint"></p>
          <div id="key-editor" class="key-editor" hidden>
            <div class="key-head"><strong id="key-name"></strong><span id="key-current" class="hint"></span></div>
            <p id="key-fn-note" class="notice" data-i18n="keysFnNote" hidden></p>
            <label class="field"><span class="label" data-i18n="keysAction"></span>
              <select id="key-type">
                <option value="key" data-i18n="actKey"></option><option value="media" data-i18n="actMedia"></option>
                <option value="macro" data-i18n="actMacro"></option><option value="disabled" data-i18n="actDisabled"></option>
              </select>
            </label>
            <div id="key-key-box" class="key-grid">
              <select id="key-modifier" aria-label="Modifier">
                <option value="0" data-i18n="modNone"></option><option value="224">Ctrl +</option><option value="225">Shift +</option>
                <option value="226">Alt +</option><option value="227">Win +</option>
              </select>
              <select id="key-target" aria-label="Key"></select>
              <button id="key-capture" type="button" data-i18n="keysCapture"></button>
            </div>
            <div id="key-media-box" hidden><select id="key-media" aria-label="Media key"></select></div>
            <div id="key-macro-box" class="key-grid" hidden>
              <select id="key-macro-slot" aria-label="Macro"></select>
              <select id="key-macro-mode" aria-label="Macro mode"></select>
            </div>
            <div class="key-grid">
              <button id="key-apply" type="button" class="primary" data-i18n="keysApply"></button>
              <button id="key-reset" type="button" data-i18n="keysResetOne"></button>
            </div>
          </div>
          <div class="tools"><button id="keys-reset-all" type="button" data-i18n="keysResetAll"></button></div>
        </section>
        <section class="panel" aria-labelledby="h-macro">
          <h2 id="h-macro" data-i18n="macros"></h2>
          <p class="hint" data-i18n="macroHelp"></p>
          <div class="key-grid">
            <select id="macro-slot" aria-label="Macro slot"></select>
            <button id="macro-load" type="button" data-i18n="macroLoad"></button>
          </div>
          <div class="key-grid">
            <button id="macro-record" type="button" data-i18n="macroRecord"></button>
            <button id="macro-clear" type="button" data-i18n="macroClear"></button>
          </div>
          <div id="macro-events" class="macro-events"></div>
          <label class="field"><span class="label" data-i18n="macroRepeat"></span><input id="macro-repeat" type="number" min="1" max="65535" value="1"></label>
          <button id="macro-save" type="button" class="primary" data-i18n="macroSave"></button>
        </section>
      </div>
    </div>

    <!-- Screen -->
    <div id="tab-screen" class="tab needs-keyboard" hidden>
      <section id="screen-card" class="panel" aria-labelledby="h-screen">
        <h2 id="h-screen" data-i18n="screen"></h2>
        <div class="screen-layout">
          <div class="screen-left">
          <canvas id="screen-canvas" class="screen" width="160" height="80" aria-label="Screen preview"></canvas>
          <div id="gif-controls" class="row" hidden>
            <button id="gif-play" type="button"></button>
            <label class="inline grow"><span data-i18n="gifFrame"></span> <input id="gif-frame" type="range" min="0" max="0" value="0"> <output id="gif-frame-out"></output></label>
          </div>
          </div>
          <div class="screen-right">
            <div class="screen-grid">
              <label class="file-button"><span data-i18n="screenPick"></span><input id="screen-file" type="file" accept="image/*"></label>
              <select id="screen-fit" data-i18n-title="screenFit" aria-label="Fit"><option value="cover" data-i18n="fitCover"></option><option value="contain" data-i18n="fitContain"></option></select>
            </div>
            <p id="screen-name" class="hint"></p>
            <div id="screen-device" class="apply-box" hidden>
              <label id="screen-slot-box" class="slot-row"><span data-i18n="screenSlot"></span><select id="screen-slot"></select></label>
              <div class="screen-grid">
                <button id="screen-send" type="button" class="primary" data-i18n="screenSend" data-i18n-title="screenSendTitle"></button>
                <button id="screen-clear-all" type="button" data-i18n="screenClearAll" data-i18n-title="screenClearAllTitle" hidden></button>
              </div>
              <progress id="screen-progress" hidden value="0" max="1"></progress>
              <p id="screen-device-note" class="hint" data-i18n="screenDeviceNote"></p>
              <p id="screen-size-note" class="hint" data-i18n="screenSizeAssumed" hidden></p>
            </div>
          </div>
          <div class="screen-gallery">
            <h3 data-i18n="gallery"></h3>
            <div id="gallery" class="gallery"></div>
          </div>
        </div>
        <div class="gallery-box">
          <h3 data-i18n="gifIdeas"></h3>
          <p class="hint" data-i18n="gifTips"></p>
          <div id="gallery-links" class="link-groups"></div>
        </div>
        <p id="screen-connect-note" class="hint" data-i18n="screenNote"></p>
      </section>
    </div>

    <!-- Profile -->
    <div id="tab-profile" class="tab needs-keyboard" hidden>
      <section id="profile-card" class="panel narrow" aria-labelledby="h-profile">
        <h2 id="h-profile" data-i18n="profile"></h2>
        <label class="field">
          <span class="label" data-i18n="profileName"></span>
          <input id="profile-name" type="text" maxlength="60" value="My profile">
        </label>
        <div class="row">
          <button id="save-local" type="button" data-i18n="saveLocal"></button>
          <select id="saved-list" aria-label="Saved profiles"></select>
          <button id="load-local" type="button" data-i18n="load"></button>
        </div>
        <div class="row">
          <button id="export-json" type="button" data-i18n="exportJson"></button>
          <label class="file-button"><span data-i18n="importJson"></span><input id="import-json" type="file" accept="application/json,.json"></label>
        </div>
        <div class="row"><button id="apply" type="button" class="primary" data-i18n="apply"></button></div>
      </section>
    </div>

    <!-- Log -->
    <div id="tab-log" class="tab" hidden>
      <section class="panel" aria-labelledby="h-log">
        <div class="panel-head"><h2 id="h-log" data-i18n="log"></h2><button type="button" class="small-btn clear-log" data-i18n="clearLog"></button></div>
        <div id="log" class="log" aria-live="polite"></div>
      </section>
    </div>
  </main>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
