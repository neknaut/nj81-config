# Render Blueprint: one Node web service, no build, no dependencies.
# server.mjs serves public/ over Render's HTTPS (WebHID needs it), sets the security headers (strict CSP,
# Permissions-Policy hid=(self)) and makes the Library's calls to the Keydous servers, which refuse a deployed page's browser.
services:
  - type: web
    name: nj81-config
    runtime: node
    plan: free
    buildCommand: echo "no build"
    startCommand: node server.mjs
    healthCheckPath: /keydous/ping
    # RENDER_EXTERNAL_URL and PORT are set by Render: server.mjs pings RENDER_EXTERNAL_URL every 10 min to stay awake.
    # On Render (it sets RENDER) server.mjs listens on 0.0.0.0 by itself: no HOST to set.
    envVars:
      - key: NODE_VERSION
        value: "22"
